<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>靈體圖鑑 · 本體光譜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1015; --ink2:#14161C; --panel:#171A21; --panel2:#1C2027;
  --line:rgba(236,230,217,.10); --line2:rgba(236,230,217,.20);
  --bone:#ECE6D9; --dim:#9B968A; --dimmer:#6C675D;
  --c-law:#AEBAC9; --c-sov:#9B86D9; --c-edge:#D5664A; --c-folk:#F2BD5C;
  --c-kin:#D58C6E; --c-thr:#6FB0A4; --c-mat:#7C7F86;
  --serif:"Songti TC","Noto Serif TC","Noto Serif CJK TC","Source Han Serif TC","STSong",serif;
  --sans:"PingFang HK","PingFang TC","Noto Sans TC","Source Han Sans TC","Microsoft JhengHei","Hiragino Sans CNS",sans-serif;
  --mono:"SFMono-Regular","SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --display:"Cormorant Garamond",var(--serif);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 80% at 50% -10%, rgba(174,186,201,.05), transparent 55%),
             radial-gradient(90% 60% at 50% 118%, rgba(124,127,134,.05), transparent 60%)}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 22px}

/* hero */
header.hero{padding:64px 0 30px;text-align:center}
.eyebrow{font-family:var(--display);font-style:italic;letter-spacing:.06em;color:var(--dim);font-size:1.05rem;margin-bottom:20px}
.spine{font-family:var(--serif);font-size:clamp(1.7rem,5.2vw,3.1rem);font-weight:400;line-height:1;
  display:flex;gap:.22em;justify-content:center;align-items:center;flex-wrap:wrap}
.spine b{font-weight:400}
.spine i{font-style:normal;color:var(--dimmer);font-size:.5em;transform:translateY(-.12em)}
.seal-law{color:var(--c-law)} .seal-sov{color:var(--c-sov)} .seal-edge{color:var(--c-edge)}
.seal-folk{color:var(--c-folk)} .seal-kin{color:var(--c-kin)} .seal-thr{color:var(--c-thr)} .seal-mat{color:var(--c-mat)}
.thesis{max-width:52ch;margin:26px auto 0;color:var(--bone);font-family:var(--serif);
  font-size:1.06rem;line-height:1.95;opacity:.92}
.thesis em{font-style:normal;color:var(--c-folk)}

/* controls */
.controls{position:sticky;top:0;z-index:30;margin-top:10px;
  background:rgba(14,16,21,.85);-webkit-backdrop-filter:blur(11px);backdrop-filter:blur(11px);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.controls-in{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;padding:13px 0}
.search{flex:1 1 200px;min-width:170px;position:relative}
.search input{width:100%;background:var(--ink2);border:1px solid var(--line2);border-radius:10px;
  color:var(--bone);font-family:var(--sans);font-size:.95rem;padding:9px 12px 9px 34px;outline:none}
.search input::placeholder{color:var(--dimmer)}
.search input:focus{border-color:rgba(242,189,92,.5)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--dim)}
.ctl-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctl-label{font-size:.72rem;letter-spacing:.14em;color:var(--dimmer);text-transform:uppercase;
  font-family:var(--display);font-style:italic}
.chip{appearance:none;cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--dim);
  font-family:var(--sans);font-size:.82rem;padding:5px 11px;border-radius:999px;transition:.18s;white-space:nowrap}
.chip:hover{color:var(--bone)}
.chip[aria-pressed="true"]{color:var(--ink);background:var(--bone);border-color:var(--bone)}
.chip.lens[aria-pressed="true"]{background:var(--c-folk);border-color:var(--c-folk);color:#3a2a08}
.lens-hint{flex-basis:100%;min-height:1.2em;color:var(--dim);font-size:.86rem;line-height:1.5;
  padding-bottom:11px;font-family:var(--serif);transition:opacity .2s}
.lens-hint b{color:var(--c-folk);font-weight:400}

/* bands */
main{padding:8px 0 40px}
.band{position:relative;padding:30px 0 34px;border-bottom:1px solid var(--line);
  opacity:0;transform:translateY(14px);transition:opacity .7s ease, transform .7s ease}
.band.in{opacity:1;transform:none}
.seal-bg{position:absolute;top:8px;right:-6px;font-family:var(--serif);line-height:.8;pointer-events:none;
  font-size:clamp(110px,17vw,210px);opacity:.05;z-index:0;user-select:none}
.band-head{position:relative;z-index:1;display:flex;align-items:baseline;gap:13px;flex-wrap:wrap;margin-bottom:6px}
.band-seal{font-family:var(--serif);font-size:2.3rem;line-height:1;opacity:.92;margin-right:3px}
.band-name{font-family:var(--serif);font-size:1.5rem;font-weight:400}
.band-en{font-family:var(--display);font-style:italic;color:var(--dim);font-size:1.1rem}
.band-tier{font-family:var(--mono);font-size:.72rem;color:var(--dimmer);letter-spacing:.05em;
  border:1px solid var(--line2);border-radius:5px;padding:2px 7px}
.band-count{font-family:var(--mono);font-size:.74rem;color:var(--dimmer);margin-left:auto}
.band-essence{position:relative;z-index:1;color:var(--dim);font-size:.95rem;line-height:1.7;
  margin:0 0 16px;max-width:64ch;font-family:var(--serif)}
.plate{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  gap:4px;border-radius:14px}
.band-warm .plate{padding:16px 12px;margin:0 -12px;
  background:radial-gradient(120% 130% at 30% 0%, var(--warm-wash), transparent 72%)}

/* entity cell = radar sigil + name */
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
  padding:11px 4px 9px;border-radius:12px;border:1px solid transparent;background:transparent;
  transition:transform .16s ease, background-color .2s ease, opacity .3s ease;color:var(--c-law)}
.cell:hover,.cell:focus-visible{transform:translateY(-3px);background:rgba(236,230,217,.045);
  border-color:var(--line);outline:none}
.cell:hover .gsig,.cell:focus-visible .gsig{fill-opacity:.52}
.glyph{display:block}
.gframe{fill:none;stroke:var(--line2);stroke-width:.6}
.gsig{fill:currentColor;fill-opacity:.32;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round;
  transition:fill-opacity .2s ease}
.cell.flag .glyph{filter:drop-shadow(0 0 5px currentColor)}
.cap{font-family:var(--serif);font-size:.8rem;line-height:1.22;text-align:center;color:var(--dim);
  max-width:12ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell.flag .cap{color:currentColor}
.cap .en{display:block;font-family:var(--display);font-style:italic;font-size:.7rem;color:var(--dimmer);
  margin-top:1px;-webkit-line-clamp:1}
.cell.dim{opacity:.1;filter:grayscale(.65);pointer-events:none}

/* footer */
footer{padding:30px 0 70px;color:var(--dim);font-size:.9rem;line-height:1.8}
.legend{display:flex;flex-wrap:wrap;gap:9px 16px;margin-bottom:18px}
.legend span{display:inline-flex;align-items:center;gap:7px;font-size:.84rem;color:var(--dim)}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
.colophon{max-width:66ch;font-family:var(--serif);line-height:1.9}
.colophon b{color:var(--bone);font-weight:400}

/* drawer */
#scrim{position:fixed;inset:0;background:rgba(6,7,10,.6);opacity:0;visibility:hidden;
  transition:opacity .3s;z-index:40}
#scrim.open{opacity:1;visibility:visible}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,93vw);background:var(--panel);
  border-left:1px solid var(--line2);transform:translateX(102%);transition:transform .34s cubic-bezier(.4,0,.2,1);
  z-index:50;overflow-y:auto;overscroll-behavior:contain}
#drawer.open{transform:none}
.dr-pad{padding:24px 26px 60px}
.dr-close{position:sticky;top:0;float:right;margin:-6px -8px 0 0;background:transparent;border:0;cursor:pointer;
  color:var(--dim);width:34px;height:34px;border-radius:50%}
.dr-close:hover{color:var(--bone);background:var(--ink2)}
.dr-close svg{width:18px;height:18px;stroke:currentColor}
.dr-tier{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;padding:3px 9px;border-radius:5px;
  display:inline-block;margin-bottom:14px}
.dr-cn{font-family:var(--serif);font-size:1.9rem;line-height:1.2;margin:0}
.dr-en{font-family:var(--display);font-style:italic;color:var(--dim);font-size:1.2rem;margin:3px 0 0}
.dr-meta{margin:14px 0 6px;display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--dim);font-size:.82rem;font-family:var(--sans)}
.dr-meta b{color:var(--bone);font-weight:400}
.radar-wrap{display:flex;justify-content:center;margin:18px 0 6px}
.axis-block{margin:16px 0 22px;display:flex;flex-direction:column;gap:9px}
.axrow{display:grid;grid-template-columns:4.2em 1fr 2em;grid-template-areas:"name bar val" "read read read";
  align-items:center;gap:3px 9px;column-gap:9px}
.axname{grid-area:name;font-family:var(--sans);font-size:.78rem;color:var(--bone);white-space:nowrap}
.axbar{grid-area:bar;height:5px;border-radius:3px;background:rgba(236,230,217,.09);overflow:hidden}
.axfill{display:block;height:100%;border-radius:3px;opacity:.85}
.axval{grid-area:val;font-family:var(--mono);font-size:.74rem;color:var(--dim);text-align:right}
.axread{grid-area:read;font-family:var(--serif);font-size:.78rem;color:var(--dimmer);line-height:1.4;padding-left:.2em}

.deepen-wrap{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}
.deepen{appearance:none;cursor:pointer;width:100%;border:1px solid var(--line2);border-radius:10px;
  background:linear-gradient(180deg,rgba(155,134,217,.08),rgba(155,134,217,.03));
  color:var(--bone);font-family:var(--display);font-style:italic;font-size:1rem;letter-spacing:.03em;
  padding:11px 14px;transition:.2s}
.deepen:hover:not(:disabled){background:linear-gradient(180deg,rgba(155,134,217,.16),rgba(155,134,217,.06));border-color:rgba(155,134,217,.45)}
.deepen:disabled{opacity:.6;cursor:wait}
.deep-card{margin-top:16px;border:1px solid rgba(155,134,217,.28);border-radius:12px;padding:16px 16px 4px;
  background:rgba(155,134,217,.05)}
.deep-tag{font-family:var(--display);font-style:italic;color:#B7A6E6;font-size:.86rem;margin-bottom:12px}
.deep-axes{margin:6px 0 12px;font-family:var(--serif);font-size:.86rem;line-height:1.75;color:var(--dim)}
.deep-axes b{color:var(--bone);font-weight:400;font-family:var(--sans)}
.deep-err{margin-top:14px;color:var(--dim);font-size:.84rem;line-height:1.6;font-family:var(--serif)}
.voice-tag{font-family:var(--display);font-style:italic;color:var(--dimmer);font-size:.92rem;
  border-top:1px solid var(--line);padding-top:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.untold{font-family:var(--sans);font-style:normal;font-size:.68rem;color:var(--dimmer);
  border:1px solid var(--line2);border-radius:5px;padding:2px 8px;white-space:nowrap}
.desc{margin:0 0 8px}
.facts{margin-top:22px;border-top:1px solid var(--line);padding-top:16px;font-size:.86rem;line-height:1.8;color:var(--dim)}
.facts div{margin-bottom:8px}
.facts b{color:var(--bone);font-weight:400;font-family:var(--sans)}
.source{margin-top:18px;color:var(--dimmer);font-size:.74rem;font-family:var(--mono)}

/* voices */
.v-law{font-family:var(--serif);letter-spacing:.13em;line-height:2.05;color:#C7D0DB;text-align:justify;font-size:1.04rem}
.v-epic{font-family:var(--serif);line-height:1.95;color:#ECE6D9;font-size:1.08rem}
.v-hero{font-family:var(--serif);line-height:1.92;color:#E8DFD0;font-size:1.05rem}
.v-folk{font-family:var(--sans);line-height:2.0;color:#F3E5C9;font-size:1.06rem;letter-spacing:.01em}
.v-kin{font-family:var(--serif);line-height:2.05;color:#ECD6BB;font-size:1.05rem;letter-spacing:.02em}
.v-threshold{font-family:var(--sans);line-height:2.18;color:#ADC1BB;font-size:1.0rem;letter-spacing:.025em}
.v-matter{font-family:var(--mono);line-height:1.9;color:#9AA0A6;font-size:.95rem;letter-spacing:.005em}
.v-coda{font-family:var(--serif);line-height:2.12;color:#F0D9B0;font-size:1.06rem;letter-spacing:.02em}

svg.radar text{font-family:var(--sans);fill:var(--dim);font-size:11px}
svg.radar .ring{fill:none;stroke:var(--line);stroke-width:.5}
svg.radar .spoke{stroke:var(--line);stroke-width:.5}
svg.radar .poly{transition:transform .5s cubic-bezier(.2,0,.2,1);transform-origin:140px 140px}
svg.radar.draw .poly{transform:scale(0)}

@media (max-width:720px){
  header.hero{padding:46px 0 22px}
  .plate{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
  #drawer{top:auto;bottom:0;right:0;left:0;width:100%;height:auto;max-height:88vh;
    border-left:0;border-top:1px solid var(--line2);border-radius:18px 18px 0 0;transform:translateY(102%)}
  #drawer.open{transform:none}
  .band-count{margin-left:0;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .band{opacity:1;transform:none}
  svg.radar.draw .poly{transform:none}
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow">靈體圖鑑 · An Ontological Spectrum</div>
    <div class="spine" aria-label="法 權 力 信 念 懼 物">
      <b class="seal-law">法</b><i>→</i><b class="seal-sov">權</b><i>→</i><b class="seal-edge">力</b><i>→</i><b class="seal-folk">信</b><i>→</i><b class="seal-kin">念</b><i>→</i><b class="seal-thr">懼</b><i>→</i><b class="seal-mat">物</b>
    </div>
    <p class="thesis">由「法則」到「物質」的一條光譜。權力最大的那個認不得你,權力最小的那個專程來找你——<em>意義,住在中間被相信、被記得的那段暖帶。</em></p>
  </header>
</div>

<div class="controls">
  <div class="wrap">
    <div class="controls-in">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input id="q" type="search" placeholder="尋一個名字…  天后、Ananke、祖先靈" aria-label="搜尋靈體">
      </div>
      <div class="ctl-group" id="regions">
        <span class="ctl-label">系統</span>
        <button class="chip reg" data-reg="all" aria-pressed="true">全部</button>
        <button class="chip reg" data-reg="希臘" aria-pressed="false">希臘</button>
        <button class="chip reg" data-reg="香港" aria-pressed="false">香港</button>
        <button class="chip reg" data-reg="其他" aria-pressed="false">其他</button>
      </div>
      <div class="ctl-group" id="lenses">
        <span class="ctl-label">光照</span>
        <button class="chip lens" data-lens="band" aria-pressed="true">依環</button>
        <button class="chip lens" data-lens="power" aria-pressed="false">本體權能</button>
        <button class="chip lens" data-lens="scope" aria-pressed="false">影響半徑</button>
        <button class="chip lens" data-lens="valence" aria-pressed="false">向人性</button>
        <button class="chip lens" data-lens="nego" aria-pressed="false">可協商度</button>
        <button class="chip lens" data-lens="vivid" aria-pressed="false">信仰熱度</button>
        <button class="chip lens" data-lens="liminal" aria-pressed="false">臨界性</button>
      </div>
      <div class="lens-hint" id="hint"></div>
    </div>
  </div>
</div>

<div class="wrap">
  <main id="spectrum" aria-label="靈體光譜"></main>
  <footer>
    <div class="legend" id="legend"></div>
    <p class="colophon" id="colophon"></p>
  </footer>
</div>

<div id="scrim"></div>
<aside id="drawer" aria-label="靈體詳情" aria-hidden="true" tabindex="-1">
  <div class="dr-pad" id="dr-body"></div>
</aside>

<script>
const ENTITIES = [{"rank": 1, "cn": "克羅諾斯（時間神）", "en": "Chronos (Time)", "system": "希臘神話", "region": "希臘", "concept": "宇宙法則", "influence": "時間本身。萬物之生滅、興衰、成壞,皆在其單向之流中推進;不偏不倚,不為任何祈求而快或慢。", "means": "加速與遲滯之隱喻權柄——能使一瞬如永劫,使百年如一瞬;然從不逆轉,因逆轉時間即取消因果本身。", "brief": "勿與泰坦 Cronus 混淆", "source": "Classical refs summary", "tier": "S", "tier_label": "S+", "num": 10, "band": "law", "radar": [96, 98, 46, 4, 16, 66], "flagship": true, "voice": null, "desc": "非泰坦克洛諾斯,乃時間本體。彼不爭,不怒,不可賄;眾生於彼,如逝水中之沫,起滅皆順流而下。爾求長壽,彼不聞;爾懼衰老,彼不顧——彼只是推,一直推,不問所推者願與不願。古來能與彼抗者,無一;能忘彼之存在者,亦無一。"}, {"rank": 2, "cn": "安那刻（必然）", "en": "Ananke", "system": "希臘神話", "region": "希臘", "concept": "宇宙法則", "influence": "必然與命運之律，連神亦受制", "means": "束縛命運線、規定事件可能性", "brief": "古典晚期強調其不可逆性", "source": "Classical refs summary", "tier": "S", "tier_label": "S+", "num": 10, "band": "law", "radar": [100, 100, 48, 3, 18, 60], "flagship": true, "voice": null, "desc": "未有神,先有彼。神能成事,不能改其所必成;星辰循軌,生死循數,皆繫於彼。爾可祈於眾神,不可祈於必然——彼非聞禱者,乃使禱告得以成立者。"}, {"rank": 3, "cn": "混沌", "en": "Chaos", "system": "希臘神話", "region": "希臘", "concept": "宇宙法則", "influence": "宇宙開端、秩序之前的原初狀態", "means": "分化萬象的始基", "brief": "《神譜》中最先出現的存在", "source": "Britannica Greek mythology / Chaos", "tier": "S", "tier_label": "S+", "num": 10, "band": "law", "radar": [98, 100, 50, 2, 20, 55], "flagship": true, "voice": null, "desc": "秩序未生之前,彼已在。非黑暗,非深淵,乃一切分化之所從出——天地、晝夜、神與人,皆自彼裂開。問彼欲何為,已是問錯:彼無欲,彼只是「先」。"}, {"rank": 4, "cn": "厄瑞玻斯（黑暗）", "en": "Erebus", "system": "希臘神話", "region": "希臘", "concept": "原初法則", "influence": "原初之幽暗,介於人間與冥界之間的那層過渡之暗。日光止步之處,即彼之領域起始。", "means": "遮蔽與過渡——使界與界之間生出一段無光的緩衝;凡須穿冥者,必先經其暗。", "brief": "與尼克斯相對", "source": "Theoi Erebus", "tier": "S", "tier_label": "S+", "num": 9, "band": "law", "radar": [84, 86, 42, 8, 14, 80], "flagship": true, "voice": null, "desc": "與夜同源,而更近於門。尼克斯是夜之帷,厄瑞玻斯是帷後那條通冥的暗廊。彼無形,無聲,無欲;爾每一次閉眼入睡,每一次步入無燈之室,都短暫地路過彼的國度。死者經此而下,生者經此而眠——同一段暗,兩種穿越。"}, {"rank": 5, "cn": "命運三女神", "en": "Moirai (The Fates)", "system": "希臘神話", "region": "希臘", "concept": "宇宙法則", "influence": "裁定生命長度與命運", "means": "紡線、丈量、剪斷", "brief": "宙斯亦須尊其秩序", "source": "Britannica Fates", "tier": "S", "tier_label": "S+", "num": 9, "band": "law", "radar": [97, 95, 45, 6, 28, 70], "flagship": true, "voice": null, "desc": "一紡其線,一量其長,一斷其端。線一經紡出,連宙斯亦不能再續。爾之長短,不在德,不在求,只在那剪刀開合之間。"}, {"rank": 6, "cn": "哈得斯", "en": "Hades", "system": "希臘神話", "region": "希臘", "concept": "冥府王權", "influence": "死後秩序與財富（冥富）", "means": "冥門封鎖、判定越界", "brief": "與珀耳塞福涅共治冥界", "source": "Britannica Hades", "tier": "S", "tier_label": "S+", "num": 9, "band": "sovereign", "radar": [88, 80, 50, 30, 50, 92], "flagship": true, "voice": null, "desc": "他不是死亡,他是死後的秩序。冥門一旦闔上,連神也不輕越;他與珀耳塞福涅共治那片無人願去、人人終至的國度。他掌的不只是亡魂,還有地底的財富——所以又名「冥富」。"}, {"rank": 7, "cn": "宙斯", "en": "Zeus", "system": "希臘神話", "region": "希臘", "concept": "王權／雷霆", "influence": "誓言與法度之最高裁量", "means": "雷霆制裁、天候操控", "brief": "眾神之王，護佑與懲戒並存", "source": "Britannica Zeus", "tier": "S", "tier_label": "S+", "num": 9, "band": "sovereign", "radar": [92, 88, 58, 35, 60, 40], "flagship": true, "voice": null, "desc": "雷霆在握,誓言在冊。凡立約者皆在他眼下,凡背誓者皆在他雷下。他既是庇護,也是懲戒——秩序由他而立,亦能由他而傾。向他求,不是求恩,是求一次公正的裁。"}, {"rank": 8, "cn": "尼克斯（夜）", "en": "Nyx", "system": "希臘神話", "region": "希臘", "concept": "原初法則", "influence": "夜的擬人與根源", "means": "黑暗帷幕、諸夜之子之母", "brief": "權柄深邃，連宙斯敬畏", "source": "Britannica Nyx", "tier": "S", "tier_label": "S+", "num": 9, "band": "law", "radar": [90, 92, 42, 10, 30, 78], "flagship": true, "voice": null, "desc": "諸夜之母,連宙斯亦敬而不犯。日落非彼之工,日落乃彼之歸。爾所懼之暗,於彼不過是回家;爾所求之明,於彼不過是暫離。"}, {"rank": 9, "cn": "烏拉諾斯（天空）", "en": "Uranus", "system": "希臘神話", "region": "希臘", "concept": "原初父神", "influence": "天穹本身,覆於大地之上的第一重秩序。宇宙之所以分為上下層級,始於彼之張開。", "means": "覆蓋與封印——以天穹罩住萬有,亦曾以此囚禁己出之子,直至被其子以鐮刀傾覆。", "brief": "與蓋婭構成天地對偶", "source": "Britannica Uranus", "tier": "S", "tier_label": "S+", "num": 9, "band": "law", "radar": [88, 92, 40, 10, 18, 58], "flagship": true, "voice": null, "desc": "第一位父,也是第一位被推翻的王。彼張為天穹,覆於蓋婭之上,使宇宙始有上下之分。然彼畏其子,囚之於地母之腹;蓋婭授鐮,克洛諾斯一揮,天地自此永遠分開。記之:最早的秩序,往往也是最早被自己後代所傾覆的秩序。"}, {"rank": 10, "cn": "蓋婭（大地）", "en": "Gaia", "system": "希臘神話", "region": "希臘", "concept": "原初母神", "influence": "大地母性,萬物所從出、所終歸之處。連諸神之王權更替,亦須得其默許,方稱「正當」。", "means": "孕育、庇護,與授予傾覆之權——她生出諸神與巨人,也一次次把鐮刀與盟約交到下一代手裏,決定誰登位、誰退場。", "brief": "眾神與巨人之母", "source": "Britannica Gaia", "tier": "S", "tier_label": "S+", "num": 9, "band": "law", "radar": [92, 94, 64, 22, 30, 50], "flagship": true, "voice": null, "desc": "萬物之母,亦是改朝換代的暗手。她生天(烏拉諾斯),又助子傾父;她生諸神,又孕巨人與之為敵。她不爭一時之主權,因為她是主權得以成立的那片土。記之:一切王朝立於其上,亦終歸於其中——她從容,因為她知道自己等得起。"}, {"rank": 11, "cn": "波塞冬", "en": "Poseidon", "system": "希臘神話", "region": "希臘", "concept": "海神／震地", "influence": "海域與地動的主宰。一船人的生還、一座城的傾覆,皆繫於其一念之怒或一念之安。", "means": "海嘯、暴潮、震地——他以三叉戟一擊,可裂海,可撼陸;凡輕慢他者,航途必險。", "brief": "海域秩序主宰，「震地者」", "source": "Britannica Poseidon", "tier": "S", "tier_label": "S+", "num": 8, "band": "sovereign", "radar": [84, 82, 38, 40, 60, 56], "flagship": true, "voice": null, "desc": "三叉戟一頓,海立而陸動。他是「震地者」,掌的不只是浪,還有大地的脊骨。荷馬筆下,他追著奧德修斯漂泊十年——神的記仇,比海更深。出海的人最懂:你可以不信他,但你最好敬他,因為你腳下那片看似溫順的水,隨時可以變成吞船的牆。"}, {"rank": 12, "cn": "赫利俄斯", "en": "Helios", "system": "希臘神話", "region": "希臘", "concept": "日輪秩序", "influence": "日輪的運行者,也是諸神誓約最公正的見證——他每日橫越天空,照見人間一切隱情,無物可瞞。", "means": "駕日車自東徂西,光照萬物;凡有隱情者逃不過他的眼,凡立偽誓者他一一記下。", "brief": "泰坦系太陽神", "source": "Britannica Helios", "tier": "S", "tier_label": "S+", "num": 6, "band": "sovereign", "radar": [78, 80, 56, 30, 52, 40], "flagship": true, "voice": null, "desc": "每日駕著火焰之車橫越長空,他看見一切——偷情、背誓、暗殺,無一逃過那隻俯瞰之眼。所以人立重誓,常請他作證:因為他從不偏私,也從不眨眼。他兒子法厄同曾求駕日車,險些焚毀大地——有些秩序,連神的孩子都駕馭不了。"}, {"rank": 13, "cn": "珀耳塞福涅", "en": "Persephone", "system": "希臘神話", "region": "希臘", "concept": "冥后／季節", "influence": "一年兩分:她在地上,則春回大地;她返冥府,則萬物凋零。四季的門檻,由她一步步踏出。", "means": "出入冥門的唯一者——生者不能往返,她能;她每一次上行下行,人間就換一次季。", "brief": "四時更替核心母題", "source": "Britannica Persephone", "tier": "S", "tier_label": "S", "num": 6, "band": "sovereign", "radar": [76, 72, 52, 38, 58, 88], "flagship": true, "voice": null, "desc": "半年為冥后,半年為春神。她被劫入冥府,吃了六顆石榴籽,從此一年要回去六個月——她一上來,大地回春;她一下去,萬物凋零。她是唯一能在生死兩界自由往返的存在。記之:四季不是天定的,是一個被奪走、又被部分歸還的女兒,用她的腳步量出來的。"}, {"rank": 14, "cn": "赫卡忒", "en": "Hecate", "system": "希臘神話", "region": "希臘", "concept": "交界／魔／三岔口", "influence": "三岔路口、門檻與夜的女神。凡在「之間」的地方——路與路之交、生與死之界——都是她的轄域。", "means": "持雙炬照幽冥,守十字路口;巫者奉她為主,亡魂憑她引路;她有三面,同時望向三個方向。", "brief": "強勢的三相女神形象", "source": "Theoi Hecate", "tier": "S", "tier_label": "S", "num": 5, "band": "sovereign", "radar": [74, 66, 50, 48, 62, 92], "flagship": true, "voice": null, "desc": "三面女神,站在每一個三岔路口。她望向過去、現在、未來;望向天、地、冥。巫者在月下喚她,旅人在岔口拜她,因為「之間」的地方最危險——而她正是「之間」的主人。希臘人在門前供她一餐,叫「赫卡忒之宴」,求她別讓不該進來的東西進來。"}, {"rank": 15, "cn": "赫耳墨斯", "en": "Hermes", "system": "希臘神話", "region": "希臘", "concept": "傳訊／商旅／引魂", "influence": "諸界的信使,也是亡魂的引路人。契約、商旅、邊界、過渡——凡須「由此達彼」之事,皆歸他管。", "means": "著飛履、持雙蛇杖,穿界如風;他既送神諭下凡,也牽亡魂入冥,是極少數能自由出入冥府而歸的神。", "brief": "眾神信使", "source": "Britannica Hermes", "tier": "S", "tier_label": "S", "num": 5, "band": "sovereign", "radar": [76, 74, 64, 52, 60, 84], "flagship": true, "voice": null, "desc": "諸神之中跑得最快的那個,穿著有翅的鞋,在天、地、冥三界之間來回送信。他也是引魂者——人死了,是他牽著魂走過那條路。商人拜他,旅人拜他,小偷也拜他(他出生第一天就偷了阿波羅的牛)。記之:邊界從不是牆,對他而言,邊界只是一道隨時可推開的門。"}, {"rank": 16, "cn": "阿波羅", "en": "Apollo", "system": "希臘神話", "region": "希臘", "concept": "文明／神諭", "influence": "預言、醫療、音樂與淨化", "means": "神諭、疫癘淨化", "brief": "紀律與光輝之神", "source": "Britannica Apollo", "tier": "A", "tier_label": "A+", "num": 10, "band": "sovereign", "radar": [80, 75, 70, 48, 64, 45], "flagship": true, "voice": null, "desc": "光、樂、醫、預言——也包括降下與止息瘟疫。德爾斐的神諭由他而出,謎一般,也真一般。他教人:知道未來,未必能改變未來;而音樂,是人對混亂唯一溫柔的反擊。"}, {"rank": 17, "cn": "雅典娜", "en": "Athena", "system": "希臘神話", "region": "希臘", "concept": "智慧／城邦", "influence": "法律、工藝、策略庇護", "means": "靈感啟迪、城邦守護", "brief": "自宙斯額間生，雅典守護神", "source": "Britannica Athena", "tier": "A", "tier_label": "A+", "num": 10, "band": "sovereign", "radar": [82, 72, 78, 45, 62, 30], "flagship": true, "voice": null, "desc": "自宙斯額間躍出,生來便是成年的智慧。她的戰爭是有紀律的戰爭,與阿瑞斯的血勇相對;她庇護城邦、法律與工藝。雅典以她為名,因為一座城最需要的,從來不是勇,是謀。"}, {"rank": 18, "cn": "得墨忒耳", "en": "Demeter", "system": "希臘神話", "region": "希臘", "concept": "農耕／四時", "influence": "穀物與收成的女神。一地的豐年或饑荒,繫於她的喜怒——她若哀傷,大地就寸草不生。", "means": "催熟與凋荒之權;當女兒被劫入冥,她令全世界顆粒無收,逼眾神交還——母親的悲傷,可以餓死整個人間。", "brief": "農耕與四時循環核心", "source": "Britannica Demeter", "tier": "A", "tier_label": "A", "num": 9, "band": "sovereign", "radar": [72, 70, 70, 44, 58, 46], "flagship": true, "voice": null, "desc": "大地的母親,也是失女的母親。珀耳塞福涅被劫入冥那年,她遍尋不獲,悲痛之下令大地寸草不生——人類眼看要餓絕,宙斯才不得不出面調停。於是有了四季:她與女兒重逢的半年,大地豐饒;分離的半年,萬物枯萎。記之:你碗裏的米,量的是一個母親一年的悲與喜。"}, {"rank": 19, "cn": "狄俄倪索斯", "en": "Dionysus", "system": "希臘神話", "region": "希臘", "concept": "狂歡／劇場", "influence": "酒、狂歡與劇場之神。他掌的是「界線鬆開」那一刻——醉意、忘我、群體共狂。", "means": "神聖的瘋狂——他能解放人,也能毀滅人;隨他起舞者得狂喜,輕慢他者被自己的瘋狂撕碎。", "brief": "秩序邊界的生命力", "source": "Britannica Dionysus", "tier": "A", "tier_label": "A", "num": 9, "band": "sovereign", "radar": [70, 64, 52, 42, 64, 70], "flagship": true, "voice": null, "desc": "他掌管的,是理性鬆手的那一刻。酒、戲、狂歡、忘我——文明繃得太緊時,需要他來鬆一鬆。但他的恩賜有兩面:跟著他跳舞的人得到狂喜,看不起他的人(如彭透斯王)被自己的母親在瘋狂中撕成碎片。記之:被壓抑的,終要找到出口;問題只是,出口由你選,還是由他替你選。"}, {"rank": 20, "cn": "赫拉", "en": "Hera", "system": "希臘神話", "region": "希臘", "concept": "婚姻／王權", "influence": "婚姻與家室秩序之后。她守護的是「盟約」本身——尤其是婚誓;背誓者,難逃她的窮追。", "means": "誓約制裁與家族庇護;宙斯每一次出軌,她的報復就落在那女子與其後代身上——她的怒,以忠誠之名而起。", "brief": "奧林帕斯之后", "source": "Britannica Hera", "tier": "A", "tier_label": "A", "num": 8, "band": "sovereign", "radar": [74, 68, 50, 40, 56, 36], "flagship": true, "voice": null, "desc": "奧林帕斯之后,婚姻的守護者,也是被背叛得最多的妻子。宙斯不停出軌,她的盛怒便一次次落在那些女子與她們的孩子身上——赫拉克勒斯一生的苦,半數由她而來。她不是善妒那麼簡單:她守的是「誓」,而她的丈夫,正是世上最不守誓的那一個。記之:最痛的怒,往往來自最該被守護的承諾。"}, {"rank": 21, "cn": "赫斯提亞", "en": "Hestia", "system": "希臘神話", "region": "希臘", "concept": "灶火／家國", "influence": "灶與爐火的女神,家與城的中心。每一個家的爐、每一座城的公火,都是她的在場。", "means": "維繫「火不滅」——只要爐火還燃,家就還在,城就還在;她無爭、無像,卻在每一處有溫度的地方。", "brief": "家宅秩序核心象徵", "source": "Britannica Hestia", "tier": "A", "tier_label": "A-", "num": 8, "band": "sovereign", "radar": [66, 60, 78, 50, 50, 30], "flagship": true, "voice": null, "desc": "諸神中最安靜的一位。她沒有神話、沒有情史、幾乎沒有雕像——因為她不在神殿,她在你家的灶頭。古希臘每一個家、每一座城,都有一處長明的爐火,那就是她。新移民出城建邦,要帶一塊母城的火種去點燃新城的爐。記之:所謂「家」,從來不是牆,是那一點不肯熄的、有人守著的暖。"}, {"rank": 22, "cn": "赫淮斯托斯", "en": "Hephaestus", "system": "希臘神話", "region": "希臘", "concept": "工藝／冶金", "influence": "工匠之神,諸神神兵的鍛造者。文明裏一切「被造出來的東西」——武器、機巧、神器——都從他的火爐而出。", "means": "火山為爐,巧手為錘;他造宙斯的雷霆、阿基里斯的盾、會自行走動的金製侍女——技術,是他補足身體之殘的方式。", "brief": "眾神工匠", "source": "Britannica Hephaestus", "tier": "A", "tier_label": "A-", "num": 8, "band": "sovereign", "radar": [70, 58, 64, 46, 52, 38], "flagship": true, "voice": null, "desc": "唯一一個又跛又被嫌棄、卻不可或缺的神。他被母親嫌醜摔下奧林帕斯,落得殘疾;但諸神的神兵——宙斯的雷、阿基里斯的盾——全出自他的火爐。他打造會自己走路的金侍女,是神話裏最早的「機械人」。記之:被輕看的那雙手,往往造出了讓所有人依賴的東西。"}, {"rank": 23, "cn": "阿耳忒彌斯", "en": "Artemis", "system": "希臘神話", "region": "希臘", "concept": "自然／狩獵", "influence": "荒野、狩獵與少女的守護神。山林之律由她而定;臨盆的婦人與未嫁的少女,同受她庇護。", "means": "銀弓遠射,例不虛發;她護獵物亦取獵物,守貞潔亦罰褻瀆——窺見她沐浴的獵人,被她變成鹿,讓自己的獵犬咬死。", "brief": "月相與自然之守護", "source": "Britannica Artemis", "tier": "A", "tier_label": "A-", "num": 8, "band": "sovereign", "radar": [72, 64, 58, 42, 54, 50], "flagship": true, "voice": null, "desc": "月光下的獵手,荒野的女主人。她要求絕對的純淨與距離——獵人阿克泰翁無意中撞見她沐浴,當場被變成一頭鹿,被自己的獵犬撕碎。她也是接生與少女的守護者:野性與貞潔,在她身上並不矛盾。記之:有些界線,不是冷酷,是一種「不可被擅入」的尊嚴。"}, {"rank": 24, "cn": "阿芙蘿黛蒂", "en": "Aphrodite", "system": "希臘神話", "region": "希臘", "concept": "愛與美", "influence": "愛、慾與美的女神。她掌的是把人與人「黏在一起」的那股力——也是把城與城拖入戰爭的那股力。", "means": "魅惑與和合;一條腰帶可令最冷的心動情。特洛伊之戰的種子,正是她許給帕里斯的「最美女人」。", "brief": "文化與家庭層面影響", "source": "Britannica Aphrodite", "tier": "A", "tier_label": "A-", "num": 8, "band": "sovereign", "radar": [70, 66, 62, 44, 60, 40], "flagship": true, "voice": null, "desc": "她是把世界黏合的力,也是把世界點燃的力。愛、慾、美——最溫柔的東西,也最危險。她許給帕里斯「世上最美的女人」海倫,於是有了十年特洛伊之戰、一座城的灰燼。記之:沒有什麼比「渴望」更能建起一段關係,也沒有什麼比「渴望」更能燒掉一座城。"}, {"rank": 25, "cn": "阿瑞斯", "en": "Ares", "system": "希臘神話", "region": "希臘", "concept": "戰鬥激情", "influence": "戰爭中「血勇」的那一面——非雅典娜的謀略之戰,而是純粹的廝殺、狂怒與破壞本身。", "means": "武力壓制與軍勢鼓動;他所到之處,理智退場,只剩屠戮的快感。連他的父親宙斯都嫌惡他。", "brief": "與雅典娜之規訓之戰相對", "source": "Britannica Ares", "tier": "A", "tier_label": "A-", "num": 7, "band": "sovereign", "radar": [72, 60, 30, 34, 54, 44], "flagship": true, "voice": null, "desc": "戰爭的另一張臉。雅典娜掌的是有紀律的戰略,他掌的是純粹的血與狂怒——廝殺本身的快感。希臘人並不愛他:連宙斯都對他說「你是我最厭惡的兒子」。他強,但魯莽,曾被凡人英雄打傷而嚎叫逃回天上。記之:暴力可以很強,但暴力很少很聰明。"}, {"rank": 26, "cn": "提豐", "en": "Typhon", "system": "希臘神話", "region": "希臘", "concept": "末日級巨獸", "influence": "顛覆秩序之災厄象徵", "means": "火舌/火山/風暴", "brief": "被宙斯鎮壓", "source": "Britannica Typhon", "tier": "B", "tier_label": "B+ · B1 末日巨獸", "num": 10, "band": "edge", "radar": [78, 70, 18, 8, 48, 60], "flagship": true, "voice": null, "desc": "百首噴火,風暴自喉間捲出——他是諸怪之父,也是秩序最後的對手。宙斯傾盡全部雷霆,才把他鎮在火山之下。記住:每次大地震動,都是他在底下翻身。他敗了,卻從未真正死去。"}, {"rank": 27, "cn": "九頭蛇", "en": "Lernaean Hydra", "system": "希臘神話", "region": "希臘", "concept": "災厄巨獸", "influence": "毒息封谷、斷頭再生", "means": "多首再生/毒液", "brief": "赫拉克勒斯二試", "source": "Britannica Hydra", "tier": "B", "tier_label": "B · B1 末日巨獸", "num": 9, "band": "edge", "radar": [64, 54, 26, 30, 48, 36], "flagship": false, "voice": null, "desc": null}, {"rank": 28, "cn": "厄喀德娜", "en": "Echidna", "system": "希臘神話", "region": "希臘", "concept": "怪物之母", "influence": "滋生諸怪", "means": "伏擊/毒性", "brief": "提豐之配偶", "source": "Classical summaries", "tier": "B", "tier_label": "B · B1 末日巨獸", "num": 9, "band": "edge", "radar": [64, 54, 48, 30, 48, 36], "flagship": false, "voice": null, "desc": null}, {"rank": 29, "cn": "喀邁拉", "en": "Chimera", "system": "希臘神話", "region": "希臘", "concept": "災厄巨獸", "influence": "噴火與突擊", "means": "獅羊蛇三合", "brief": "被貝勒羅豐討伐", "source": "Britannica Chimera", "tier": "B", "tier_label": "B · B1 末日巨獸", "num": 9, "band": "edge", "radar": [64, 54, 26, 30, 48, 36], "flagship": false, "voice": null, "desc": null}, {"rank": 30, "cn": "刻耳柏洛斯", "en": "Cerberus", "system": "希臘神話", "region": "希臘", "concept": "冥府守衛", "influence": "把守冥門、防止越界", "means": "多首咬擊/門戶守護", "brief": "冥界門犬", "source": "Britannica Cerberus", "tier": "B", "tier_label": "B+ · B2 冥府禁衛", "num": 8, "band": "edge", "radar": [62, 82, 83, 24, 48, 81], "flagship": false, "voice": null, "desc": null}, 難中人喚她名,她聞聲而至——病、厄、無依,她都接。", "means": "千手千眼,遍照人間疾苦;不設門檻,不問你信幾多,只問你苦唔苦。", "brief": "普及民間信仰", "source": "HK folk religion", "tier": "C", "tier_label": "D", "num": 10, "band": "folk", "radar": [56, 60, 92, 80, 88, 44], "flagship": true, "voice": null, "desc": "「觀世音」——聽世間苦聲嗰位。香港人遇難關,口裏一句「觀音菩薩保佑」,求嘅唔係發達,係一個「捱得過」。佢千手千眼,邊度有苦就伸手去邊度;唔使你夠虔誠,唔使你識規矩,你開聲,佢就聽。最慈悲嘅神,門檻往往最低。"}, {"rank": 125, "cn": "東海龍王", "en": "Dragon King (East Sea)", "system": "華人民間（香港）", "region": "香港", "concept": "雨水／海象", "influence": "祈雨與海象調節", "means": "風雨調和", "brief": "沿海祈雨重要神", "source": "民俗概述", "tier": "C", "tier_label": "D", "num": 9, "band": "folk", "radar": [52, 60, 48, 85, 40, 50], "flagship": false, "voice": null, "desc": null}, {"rank": 128, "cn": "關帝（關公）", "en": "Guan Di (Guan Yu)", "system": "香港/華人民間", "region": "香港", "concept": "武德／商旅信義", "influence": "忠義之神,商家與差人共拜。講「義」字嗰行——做生意、撐場面、認兄弟——都拜佢。", "means": "一把青龍偃月刀,鎮邪、護財、立信;桌頭一尊關公,既係保平安,亦係提自己做人要對得住個「義」字。", "brief": "香火遍及港澳", "source": "民俗概述", "tier": "C", "tier_label": "D", "num": 9, "band": "folk", "radar": [60, 62, 72, 78, 90, 38], "flagship": true, "voice": null, "desc": "由三國嘅武將,變成成個華人世界拜得最廣嘅神之一。香港尤其得意:茶餐廳收銀後面有佢,江湖中人拜佢,警署裏面都有佢——因為大家拜嘅係同一個字:「義」。佢一手青龍刀,鎮得住邪,也鎮得住人心。記住:佢威,但佢威喺「講信用」三個字度。"}, {"rank": 130, "cn": "黃大仙（靈驗公）", "en": "Wong Tai Sin", "system": "香港民間信仰", "region": "香港", "concept": "治病祈福／籤詩", "influence": "醫病解厄、求簽問卜", "means": "祈願/籤詩", "brief": "嗇色園為主要廟宇", "source": "Sik Sik Yuen official", "tier": "C", "tier_label": "C", "num": 9, "band": "folk", "radar": [46, 50, 88, 92, 90, 38], "flagship": true, "voice": null, "desc": "「有求必應」唔係講笑。求病、求姻緣、求個心安,搖支籤,等師傅幫你解。佢叻在乜都肯聽——人哋怕你煩,佢唔怕。去到嗇色園,排幾耐都好,輪到你嗰陣,佢真係喺度。"}, {"rank": 131, "cn": "城隍", "en": "Cheng Huang (City God)", "system": "香港/華人民間", "region": "香港", "concept": "城邑司法", "influence": "一城之冥官,管陰間秩序與賞善罰惡。生人有官府,死後有城隍——他是那條看不見的司法線。", "means": "點算一城生死功過,緝拿厲鬼孤魂;善者記功,惡者入冊。城隍廟裏那把算盤,算的是你一世的賬。", "brief": "城池守護的司法神", "source": "Britannica Cheng Huang", "tier": "C", "tier_label": "D+", "num": 8, "band": "folk", "radar": [58, 58, 60, 66, 70, 64], "flagship": true, "voice": null, "desc": "陽間有衙門,陰間有城隍。佢係一座城嘅冥界判官,管嘅係死後嘅秩序——邊個善、邊個惡,佢一本賬記住晒。香港城隍廟裏常見「你又嚟喇」幾隻大字,意思係:你一世做過乜,上嚟呢度就清楚。佢唔似觀音咁純慈悲,佢講嘅係「公道」二字。"}, {"rank": 133, "cn": "洪聖（南海神）", "en": "Hung Shing", "system": "香港民間信仰", "region": "香港", "concept": "海神／天候", "influence": "漁民與海象守護", "means": "鎮海/風向", "brief": "多區洪聖廟", "source": "HKTB festivals", "tier": "C", "tier_label": "C+", "num": 8, "band": "folk", "radar": [50, 82, 83, 84, 88, 50], "flagship": false, "voice": null, "desc": null}, {"rank": 135, "cn": "譚公", "en": "Tam Kung", "system": "香港民間信仰", "region": "香港", "concept": "預報天氣／醫病", "influence": "對漁民庇佑", "means": "氣象/治病", "brief": "香港具本地特色的海神信仰", "source": "HKTB Tam Kung", "tier": "C", "tier_label": "C", "num": 8, "band": "folk", "radar": [50, 44, 83, 84, 88, 36], "flagship": false, "voice": null, "desc": null}, {"rank": 137, "cn": "卡戎", "en": "Charon", "system": "希臘神話", "region": "希臘", "concept": "引魂擺渡", "influence": "冥河的擺渡人。亡魂要過斯堤克斯河,必先付他一枚銀幣;付不起的,只能在岸邊遊蕩百年。", "means": "一篙一船,只渡已葬之亡;生人闖入,他亦可載,但回程從不保證。", "brief": "冥界必要角色", "source": "Britannica Charon", "tier": "C", "tier_label": "C+", "num": 7, "band": "sovereign", "radar": [40, 36, 40, 24, 52, 90], "flagship": true, "voice": null, "desc": "死亡之後的第一個收費站。希臘人下葬時,會喺死者口中放一枚銀幣(俄玻羅斯)畀船資。冇錢嘅亡魂,過唔到河,要喺岸邊飄一百年。佢唔殘忍,佢只係照規矩做嘢:連死,都有佢嘅手續費。記之:有啲門檻,唔係用德行過,係用銀錢過——呢個冷冰冰嘅事實,連冥界都認。"}, {"rank": 139, "cn": "土地公（福德正神）", "en": "Tudi Gong (Fude Zhengshen)", "system": "香港/華人民間", "region": "香港", "concept": "土地／社學", "influence": "社稷小神、家宅庇護", "means": "地氣調和/財祿", "brief": "在地最普遍的守護神", "source": "Britannica Tudi Gong", "tier": "C", "tier_label": "D", "num": 7, "band": "folk", "radar": [38, 32, 82, 90, 80, 30], "flagship": true, "voice": null, "desc": "街角樓梯底嗰個細細嘅神位,就係佢。佢管嘅唔大——就你呢頭、呢條街、呢間舖。初一十五擺返兩件生果、燒返炷香,佢就幫你睇住門口、護你個小生意。神唔使大,夠近就得。"}, {"rank": 140, "cn": "文武廟神群", "en": "Man Mo Temple deities", "system": "香港民間", "region": "香港", "concept": "文昌／武德", "influence": "學業與官祿", "means": "庇佑/考運", "brief": "上環文武廟為代表", "source": "HK tourism/culture", "tier": "C", "tier_label": "D", "num": 7, "band": "folk", "radar": [49, 44, 82, 66, 87, 36], "flagship": false, "voice": null, "desc": null}, {"rank": 141, "cn": "阿里斯泰俄斯", "en": "Aristaeus", "system": "希臘神話", "region": "希臘", "concept": "農藝／蜂業次級神", "influence": "養蜂、製酪、橄欖與牧群的次級神。日常之中那些「靠技藝養活自己」的行當,由他守護。", "means": "教人取蜜而不滅蜂、製酪而不腐、種橄欖而得油——實用的恩典,不轟烈,但管飽。", "brief": "農藝與蜂業之神，多作地方性守護；非戰鬥型", "source": "Theoi", "tier": "C", "tier_label": "C+", "num": 6, "band": "sovereign", "radar": [44, 42, 72, 50, 40, 30], "flagship": true, "voice": null, "desc": "唔係顯赫嘅大神,係教人點養蜂、整芝士、榨橄欖油嗰位。神話入面,佢曾因害死奧菲斯之妻而招致蜂群盡死,要贖罪先重得養蜂之術——連教人「搵食」嘅神,都要先學識「賠償」。記之:最貼地嘅神,往往掌嘅係「點樣靠雙手過日子」呢件事。"}, {"rank": 142, "cn": "祖先壇（港）", "en": "Ancestral Altar (HK)", "system": "香港民間", "region": "香港", "concept": "宗族守護", "influence": "家運延續", "means": "夢託/家法", "brief": "祠堂文化", "source": "HK folklore", "tier": "C", "tier_label": "D", "num": 6, "band": "kin", "radar": [30, 24, 82, 70, 38, 80], "flagship": true, "voice": "kin", "desc": "一塊木牌、一個香爐,就係一條由生人接返去死人嗰度嘅線。後生嗰陣唔覺;到你自己做咗人哋阿爸阿媽,先明白點解屋企個廳要長期留個位俾佢哋。佢哋話事嘅方法,係入你個夢。"}, {"rank": 143, "cn": "九繆斯（合）", "en": "Nine Muses", "system": "希臘神話", "region": "希臘", "concept": "藝術／靈感", "influence": "史詩、歷史、天文、悲喜劇、舞蹈、頌歌……九位姊妹,各掌一門。凡創作者開口求靈感,都是在喚她們。", "means": "她們不替你寫,只在你卡住時遞來那一線光;靠近她們者文思泉湧,得罪她們者江郎才盡。", "brief": "各司其職的藝術神群", "source": "Britannica Muses", "tier": "C", "tier_label": "C+", "num": 5, "band": "sovereign", "radar": [56, 58, 74, 46, 66, 40], "flagship": true, "voice": null, "desc": "「詩人啊,請為我歌唱」——荷馬史詩開篇第一句,就係喚緊佢哋。九姊妹分掌史詩、歷史、天文、悲劇、喜劇、舞蹈、情詩、頌歌、聖樂。佢哋係「靈感」本身嘅化身:你諗極都諗唔到嗰下,突然腦海一光——嗰道光,就係佢哋。記之:創作從來唔係獨自完成,你只係負責坐喺度,等佢哋嚟。"}, {"rank": 144, "cn": "伊里斯", "en": "Iris", "system": "希臘神話", "region": "希臘", "concept": "虹／傳信", "influence": "彩虹女神,神界的女信使。她沿著虹橋,把神諭與旨意由奧林帕斯帶落人間與海底。", "means": "化作一道虹,瞬息跨越天、海、冥;她也為諸神取斯堤克斯之水,以證重誓。", "brief": "與赫耳墨斯互補", "source": "Theoi Iris", "tier": "C", "tier_label": "C+", "num": 5, "band": "sovereign", "radar": [50, 56, 66, 40, 46, 56], "flagship": true, "voice": null, "desc": "雨後嗰道彩虹,係佢留低嘅足印。佢係赫耳墨斯之外另一位信使,專替天后赫拉跑腿,沿住虹橋連起天上人間。佢亦負責由冥河取水,畀諸神立誓之用。記之:最美嘅自然現象之一——彩虹——喺希臘人眼中,只係一位女神匆匆走過嘅痕跡。"}, {"rank": 146, "cn": "倪姬", "en": "Nike", "system": "希臘神話", "region": "希臘", "concept": "勝利", "influence": "勝利本身的化身。賽場、戰場、競爭——凡有輸贏之處,她張開雙翼,降臨在贏家身旁。", "means": "她不參戰,只「宣告」誰勝;她常隨宙斯與雅典娜側,為勝者加冕,為敗者掉頭就走。", "brief": "勝利女神", "source": "Britannica Nike", "tier": "C", "tier_label": "C+", "num": 5, "band": "sovereign", "radar": [54, 52, 60, 40, 62, 34], "flagship": true, "voice": null, "desc": "一對翅膀、一頂桂冠——佢就係「勝利」呢個概念生出嚟嘅形。運動會、戰爭、任何要分高下嘅場合,佢都飛喺贏嗰邊。今日全世界最出名嘅波鞋商標,畫嘅就係佢嗰隻翼。記之:勝利從來唔屬於任何人,佢只係短暫停留,然後又飛去下一個贏家身上。"}, {"rank": 147, "cn": "優諾米亞", "en": "Eunomia", "system": "希臘神話", "region": "希臘", "concept": "良序", "influence": "「良好秩序」的女神,時序三姊妹之一。她掌的是法律被好好遵守、城邦運轉順暢那種「井然」。", "means": "不靠刑罰,靠「自覺」——她在的地方,人不是怕罰才守規,而是因為秩序本身令人安心。", "brief": "荷瑞三女之一", "source": "Theoi Eunomia", "tier": "C", "tier_label": "C+", "num": 5, "band": "sovereign", "radar": [50, 52, 72, 46, 40, 32], "flagship": true, "voice": null, "desc": "唔係立法嘅神,係「守法守得好」嗰種狀態嘅化身。一座城井井有條、人人各安其位、唔使成日靠差人——嗰種「順暢」,就係佢。佢同正義(狄刻)、和平(愛瑞妮)係三姊妹,合稱時序女神。記之:最好嘅秩序,係你根本唔覺佢存在嗰種。"}, {"rank": 148, "cn": "克裡俄斯", "en": "Crius", "system": "希臘神話", "region": "希臘", "concept": "星座樞紐", "influence": "較少故事的泰坦之一,被視為星辰與天極的支柱——南方天柱,固定群星運行的軸。", "means": "作為「軸」而存在:不行動,只支撐;天穹之所以不塌、星辰之所以循軌,賴其不動。", "brief": "泰坦之一", "source": "Theoi Crius", "tier": "C", "tier_label": "C+", "num": 5, "band": "sovereign", "radar": [60, 60, 46, 20, 26, 46], "flagship": true, "voice": null, "desc": "十二泰坦中最沉默嗰位,幾乎冇神話。後世將佢視為「天之南柱」——固定群星嘅其中一根軸。佢唔做嘢,佢只係「撐住」:正因為有佢呢類唔動嘅存在,星空先唔會散。記之:有啲力量,一生唔出場,但佢一旦鬆手,成個天就會塌。"}, {"rank": 149, "cn": "厄洛斯（原初愛）", "en": "Eros (primordial)", "system": "希臘神話", "region": "希臘", "concept": "原初愛／結合", "influence": "非後世那個調皮小愛神,而是《神譜》中最早出現的原初力量之一:令萬物相互吸引、結合、繁衍的根本動力。", "means": "不射箭,不戲弄——他是「吸引」本身;有他,分散的元素才願意聚合,宇宙才得以成形。", "brief": "早期宇宙論神格", "source": "Britannica Eros", "tier": "C", "tier_label": "C+", "num": 5, "band": "sovereign", "radar": [66, 64, 58, 30, 58, 42], "flagship": true, "voice": null, "desc": "唔好同後世嗰個射箭嘅小邱比特混淆。最古老嘅厄洛斯,係《神譜》入面繼混沌、大地之後就出現嘅原初力——「結合」本身。冇佢,萬物互相排斥,宇宙永遠係一盤散沙。記之:愛,喺最古老嘅意義入面,唔係感情,係令一切願意「埋嚟一齊」嘅那股力。"}, {"rank": 150, "cn": "堤刻", "en": "Tyche", "system": "希臘神話", "region": "希臘", "concept": "城運／機運", "influence": "命運與機運的女神,尤掌一城一邦的興衰氣數。豐收或瘟疫、繁榮或傾覆,常被歸於她的轉輪。", "means": "手持輪與舵——輪,是無常的循環;舵,是她隨手撥動的方向。她不講道理,只講「運氣」。", "brief": "機運之女神", "source": "Britannica Tyche", "tier": "C", "tier_label": "C+", "num": 5, "band": "sovereign", "radar": [54, 56, 48, 38, 58, 44], "flagship": true, "voice": null, "desc": "「彩數」嘅化身。一座城點解突然興旺、又點解一夜衰落?希臘化時代嘅人歸咎於佢——運氣女神。佢手持一個輪(命運循環)同一支舵(隨意撥向)。佢唔賞善罰惡,佢只係……隨機。記之:努力之外,總有一塊你控制唔到嘅地方——嗰塊,就係佢嘅地頭。"}, {"rank": 151, "cn": "塞勒涅", "en": "Selene", "system": "希臘神話", "region": "希臘", "concept": "月相秩序", "influence": "月亮本體的女神,駕銀車夜夜橫越天空。月之盈虧、潮之漲落、夜行者之光,皆繫於她。", "means": "駕月車自西徂東,與兄長日神赫利俄斯輪值;她的光不灼人,只温柔地照亮黑暗的那一半世界。", "brief": "月神，與赫利俄斯對偶", "source": "Britannica Selene", "tier": "C", "tier_label": "C+", "num": 5, "band": "sovereign", "radar": [62, 66, 56, 30, 52, 58], "flagship": true, "voice": null, "desc": "月亮本身。佢每晚駕住銀色嘅車,行過兄長赫利俄斯(太陽)走過嘅同一條天路。佢愛上凡人恩底彌翁,求宙斯令佢永遠長睡不老,好等自己夜夜可以去探佢——神嘅愛,有時係將所愛之人,溫柔地留喺夢裏。記之:月光唔似日光咁刺眼,佢只係靜靜照亮,世界黑暗嗰一半。"}, {"rank": 152, "cn": "墨涅莫辛涅", "en": "Mnemosyne", "system": "希臘神話", "region": "希臘", "concept": "記憶", "influence": "記憶女神,泰坦之一,九繆斯之母。在文字未興的年代,「記得」就是文明本身——史詩、律法、技藝,全靠她代代相傳。", "means": "她是「不被遺忘」的力量;冥界有一條她的記憶之泉,飲之者保留前世記憶,不墮入遺忘之河。", "brief": "繆斯之母", "source": "Britannica Mnemosyne", "tier": "C", "tier_label": "C+", "num": 5, "band": "sovereign", "radar": [64, 62, 60, 28, 40, 62], "flagship": true, "voice": null, "desc": "記憶本身,亦是九位繆斯嘅母親——唔記得,邊有藝術?喺冇文字嘅古代,「記得」就係文明:史詩、家譜、律法,全靠人腦一代傳一代。冥界有兩條泉,一條叫忘川(遺忘),一條就係佢(記憶);飲邊條,決定你下世記唔記得自己。記之:被記住,就係一種不死——呢個主題,你喺成本圖鑑最底嗰環(念)會再遇到。"}, {"rank": 153, "cn": "安菲特里忒", "en": "Amphitrite", "system": "希臘神話", "region": "希臘", "concept": "海后", "influence": "波塞冬之后,海洋的王后。深海的平靜與豐饒由她司掌,是海中女神涅瑞伊得斯之首。", "means": "安撫波濤、孕育海族;她不像丈夫那樣以震怒示人,而是以「海的母性」維繫深處的秩序。", "brief": "波塞冬之妻", "source": "Theoi Amphitrite", "tier": "C", "tier_label": "C+", "num": 5, "band": "sovereign", "radar": [60, 58, 58, 38, 44, 46], "flagship": true, "voice": null, "desc": "海王波塞冬嘅妻子,深海嘅王后。佢本是海中仙女,波塞冬向佢求婚被拒,逃到大海盡頭,最後由一隻海豚替佢說情先肯下嫁(嗰隻海豚被升上天,成為海豚座)。佢掌嘅唔係風浪,係深海嘅豐饒同寧靜。記之:海有兩面——丈夫嗰面係怒濤,妻子呢面,係深處嗰種唔聲唔響嘅遼闊。"}, {"rank": 154, "cn": "忒彌斯", "en": "Themis", "system": "希臘神話", "region": "希臘", "concept": "法度／秩序", "influence": "神聖法則與「應然」的女神,泰坦之一。她掌的不是人間律條,而是天地之間那條「事情本該如此」的根本秩序。", "means": "立於宙斯之側,為眾神議事定規;德爾斐神諭最初由她持掌,後讓予阿波羅。", "brief": "宙斯的秩序輔佐", "source": "Britannica Themis", "tier": "C", "tier_label": "C+", "num": 5, "band": "sovereign", "radar": [70, 66, 66, 30, 48, 46], "flagship": true, "voice": null, "desc": "「天理」嘅化身。佢唔係管人間法律,佢管嘅係更高嗰層——「事情本應點樣」嘅秩序。連宙斯開會,都要請佢坐喺側邊定規矩。今日法院門口蒙眼持劍與天秤嗰位女神,原型就係佢(同女兒狄刻)。記之:法律會變,但「公道自在人心」嗰種更深嘅應然——嗰個,就係佢守住嘅嘢。"}, {"rank": 155, "cn": "愛瑞妮（和平）", "en": "Eirene (Peace)", "system": "希臘神話", "region": "希臘", "concept": "和平", "influence": "「和平」女神,時序三姊妹之一,常懷抱象徵豐裕的財神普路托斯嬰孩。和平不是無事,而是讓萬物得以生長的安寧。", "means": "不靠武力,靠「停戰」帶來的繁榮;她在的地方,農田得耕、孩童得長、城邦得富。", "brief": "荷瑞三女之一", "source": "Britannica Eirene", "tier": "C", "tier_label": "C+", "num": 5, "band": "sovereign", "radar": [50, 52, 76, 46, 46, 30], "flagship": true, "voice": null, "desc": "「和平」嘅化身,時序三姊妹之一。佢常被畫成懷抱住財神嬰孩——因為和平唔係「冇打仗」咁簡單,係令農田有人耕、細路有得大、城市先富得起嗰種安寧。佢同良序、正義係姊妹:三樣加埋,先係一個城真正嘅好。記之:和平唔係一種狀態,係一種要日日守住、先養得起繁榮嘅難得平衡。"}, {"rank": 156, "cn": "涅墨西斯", "en": "Nemesis", "system": "希臘神話", "region": "希臘", "concept": "因果／報應", "influence": "「應得報應」的女神。她針對的是傲慢(hubris)——凡得意忘形、僭越本分者,她必使其跌回原位。", "means": "不暴怒,只「平衡」;你升得越高過頭,她拉你跌得越重。福禍盈虧,她一一找補。", "brief": "報應與平衡之神", "source": "Britannica Nemesis", "tier": "C", "tier_label": "C+", "num": 5, "band": "sovereign", "radar": [66, 62, 42, 26, 52, 52], "flagship": true, "voice": null, "desc": "唔係復仇,係「平衡」。佢專盯住一種人:得咗少少就囂張、唔記得自己係邊個嗰種(希臘人叫 hubris,傲慢)。你升得越高過自己應得嗰份,佢就拉你跌得越痛。水仙花少年那喀索斯,正係被佢罰至愛上自己倒影而死。記之:天地有一條暗線,專門搵返「過咗火」嗰啲——嗰條線,叫佢。"}, {"rank": 158, "cn": "涅柔斯", "en": "Nereus", "system": "希臘神話", "region": "希臘", "concept": "海之老者", "influence": "「海之老者」,真理與預言之神,五十海仙女涅瑞伊得斯之父。性情温和,從不說謊。", "means": "通曉一切過去未來,但須被擒住、且不斷變形仍制不住時,才肯吐露真言。", "brief": "海神族之祖", "source": "Britannica Nereus", "tier": "C", "tier_label": "C+", "num": 5, "band": "sovereign", "radar": [56, 52, 68, 42, 38, 52], "flagship": true, "voice": null, "desc": "大海最年長嗰位,人稱「海中老人」。佢溫和、誠實、永不講大話,通曉一切真相——但你想佢開口,要喺佢不斷變形(化水、化火、化獸)之中死攬唔放,佢制你唔住先肯講。記之:真相從來唔會主動送上門,你要捉得住佢、又頂得住佢千變萬化,佢先肯講真話。"}, {"rank": 159, "cn": "狄刻", "en": "Dike", "system": "希臘神話", "region": "希臘", "concept": "正義", "influence": "「正義」女神,忒彌斯之女,時序三姊妹之一。她司掌人間的公道審判——尤其凡人之間「對與不對」的裁斷。", "means": "向宙斯稟報人間每一樁不義;見冤屈而無人申,她便落淚,而她的淚,終會化作報應。", "brief": "荷瑞三女之一", "source": "Theoi Dike", "tier": "C", "tier_label": "C+", "num": 5, "band": "sovereign", "radar": [62, 58, 68, 32, 48, 42], "flagship": true, "voice": null, "desc": "母親忒彌斯掌「天理」,佢掌嘅係更貼地嗰層——人與人之間嘅「公道」。佢日日向宙斯稟報人間邊度有不義;見到冤情無人理,佢就喊,而佢嘅眼淚,最終會變成報應落返去做惡嗰人身上。記之:你以為冇人見到嘅不公?有一位,一直喺度睇住,而且,佢識喊。"}, {"rank": 160, "cn": "福柏", "en": "Phoebe", "system": "希臘神話", "region": "希臘", "concept": "月光／預言", "influence": "泰坦女神,德爾斐神諭的早期持掌者,「光明」與預言的源頭之一。月神塞勒涅、勒托皆出其血脈。", "means": "通預言之力,後將德爾斐聖所傳予孫兒阿波羅——預言之權,由泰坦一代交棒予奧林帕斯。", "brief": "泰坦之一", "source": "Theoi Phoebe", "tier": "C", "tier_label": "C+", "num": 5, "band": "sovereign", "radar": [58, 54, 56, 30, 38, 54], "flagship": true, "voice": null, "desc": "泰坦一代嘅預言女神,德爾斐神諭最早嘅主人之一。佢將呢座全希臘最神聖嘅問卜聖所,一代代傳落去,最後交到孫仔阿波羅手上。佢係月神塞勒涅同勒托嘅祖母——「光」呢條血脈,由佢嗰度開始。記之:有啲力量,佢最大嘅作為唔係佔有,係識得幾時放手、交俾下一代。"}, {"rank": 162, "cn": "許癸厄亞", "en": "Hygeia", "system": "希臘神話", "region": "希臘", "concept": "健康", "influence": "「健康」女神,醫神阿斯克勒庇俄斯之女。她掌的不是治病,而是「不生病」——清潔、預防、日常的安康。", "means": "以一條蛇與一隻碗為記;她教人潔淨與節制,使病不生——今日「衛生(hygiene)」一詞,正源於她。", "brief": "醫神之女", "source": "Theoi Hygeia", "tier": "C", "tier_label": "C+", "num": 5, "band": "sovereign", "radar": [52, 54, 80, 48, 52, 30], "flagship": true, "voice": null, "desc": "醫神嘅女兒,但佢同老豆分工:老豆醫病,佢負責「唔好病」。清潔、預防、飲食有節——今日英文「hygiene(衛生)」呢個字,就係佢個名嚟。藥房標誌嗰條纏住碗嘅蛇,畫嘅就係佢。記之:最高明嘅醫術,唔係救返一個病人,係令佢一開始就唔使病。"}, {"rank": 164, "cn": "赫柏", "en": "Hebe", "system": "希臘神話", "region": "希臘", "concept": "青春", "influence": "「青春」女神,宙斯與赫拉之女。在英雄赫拉克勒斯升天封神後,她下嫁於他——青春,是給予功成者的酬賞。", "means": "為諸神斟「神酒」(瓊漿),令奧林帕斯諸神永葆不老;她在哪裡,衰老就止步。", "brief": "赫拉與宙斯之女", "source": "Theoi Hebe", "tier": "C", "tier_label": "C+", "num": 5, "band": "sovereign", "radar": [48, 46, 74, 44, 46, 30], "flagship": true, "voice": null, "desc": "青春嘅化身,宙斯同赫拉嘅女兒。佢喺奧林帕斯嘅工作,係替諸神斟長生不老嘅瓊漿——有佢喺度,神先會永遠後生。英雄赫拉克勒斯捱完一世苦、升天封神之後,娶嘅就係佢:辛苦到盡頭,得到嘅酬賞,係永恆嘅青春。記之:青春係一份恩賜,而呢份恩賜,留俾捱得過考驗嗰個。"}, {"rank": 165, "cn": "阿斯特瑞亞", "en": "Astraea", "system": "希臘神話", "region": "希臘", "concept": "正義之星", "influence": "「星之正義」女神。神話中,她是諸神最後一個離開墮落人間的——黃金時代終結時,她升天化作室女座。", "means": "以星辰之純淨衡量人心;當世間不義到她再無法忍受,她便棄世登天,留下一個沒有正義的人間。", "brief": "維吉爾等作品有存", "source": "Classical/poetic", "tier": "C", "tier_label": "C+", "num": 5, "band": "sovereign", "radar": [56, 56, 72, 30, 42, 50], "flagship": true, "voice": null, "desc": "「星辰少女」,正義最後嘅守望者。傳說人類由黃金時代墮落,神一個個離開污濁嘅人間;佢係最後一個走嗰位——一直忍到忍唔住,先升上天,化作室女座。佢一走,人間就再冇純粹嘅正義。記之:佢嘅離開係一個警告——當最有耐性嗰位都決定走,就係世界真正變壞嗰一刻。"}, {"rank": 166, "cn": "井神", "en": "Well spirit", "system": "香港民間", "region": "香港", "concept": "水源守護", "influence": "衛生與禁忌", "means": "示警/保護", "brief": "傳統村落口述", "source": "地方志", "tier": "C", "tier_label": "F", "num": 5, "band": "folk", "radar": [46, 44, 80, 66, 70, 36], "flagship": false, "voice": null, "desc": null}, {"rank": 167, "cn": "地方路神（港）", "en": "Roadside shrine (HK)", "system": "香港民間", "region": "香港", "concept": "路口守護", "influence": "庇護行人", "means": "香案/界樁", "brief": "地誌", "source": "地方志", "tier": "C", "tier_label": "D", "num": 5, "band": "folk", "radar": [46, 32, 80, 66, 70, 72], "flagship": false, "voice": null, "desc": null}, {"rank": 168, "cn": "大黑狗（港）", "en": "Black dog (HK warning)", "system": "香港都市傳說", "region": "香港", "concept": "夜路驚嚇", "influence": "嚇阻危險地段", "means": "低吼/尾隨", "brief": "英倫母題本地化", "source": "HK urban lore", "tier": "C", "tier_label": "C", "num": 5, "band": "folk", "radar": [46, 44, 14, 66, 68, 72], "fla  "夢境通信", "brief": "家庭性質的敘事常見", "source": "General folklore", "tier": "H", "tier_label": "H", "num": 3, "band": "kin", "radar": [10, 12, 82, 22, 30, 88], "flagship": true, "voice": "coda", "desc": "排在最末,本體之力近乎於零。佢冇香火、冇廟、冇神格——佢只係喺你最掛念嗰個人離開之後,有一晚,行入你個夢,同你講返句說話。全本圖鑑由「連神都跪低」嘅必然開始,到呢度,剩低嘅,只係一個夢、一句道別。權力最大嗰個認唔得你;權力最細嗰個,專程嚟搵你。"}, {"rank": 254, "cn": "塔耳塔羅斯", "en": "Tartarus", "system": "希臘神話", "region": "希臘", "concept": "原初深淵法則", "influence": "比冥界更深的原初深淵——眾神囚禁泰坦與最危險存在之處,也是宇宙的「底」。", "means": "作為「最底」而存在:一切被徹底放逐者沉入於此,自天界墮落至此需九日。它不審判,只關押。", "brief": "冥府之下的牢底,囚禁泰坦與提豐之所", "source": "Theoi Tartarus", "tier": "S", "tier_label": "S · 原初深淵", "num": 9, "band": "law", "radar": [90, 88, 30, 4, 22, 82], "flagship": true, "voice": null, "desc": "在冥府之下,尚有一層。哈得斯之國收納尋常亡魂,而塔耳塔羅斯,是連神都恐懼的牢底——被推翻的泰坦囚於此,提豐鎮於此。傳說自天墜落至其底,需墜九日九夜。彼非地,非神,乃宇宙之「最深」本身:凡須被永遠隔絕者,皆沉於此。記之:每一個秩序,都需要一個放逐最危險之物的地方——而那地方,深得連光都到不了。"}, {"rank": 255, "cn": "蓬托斯", "en": "Pontus", "system": "希臘神話", "region": "希臘", "concept": "原初海洋", "influence": "原初的海本身,大地蓋婭未經交合而生的孩子。一切海神、海怪的血脈,皆溯源於彼。", "means": "作為「海之始基」而存在,不掀風浪,只是「海之所以為海」;後世諸海神,不過是其分化出的面孔。", "brief": "蓋婭所生的原初鹹水之海,眾海神之源", "source": "Theoi Pontus", "tier": "S", "tier_label": "S · 原初海", "num": 8, "band": "law", "radar": [80, 84, 46, 8, 20, 54], "flagship": true, "voice": null, "desc": "先有海,而後有海神。蓋婭獨自生出彼——原初的鹹水,世界的環抱之洋。波塞冬掌海之主權,涅柔斯掌海之真言,然此二者及一切海族,血脈皆自彼出。彼無面、無怒、無欲,只是「海」這個字最古老的那層意思。記之:在每一位有名有姓的海神之下,還有一片不被祈求、只是浩瀚著的、最初的水。"}, {"rank": 256, "cn": "斯堤克斯", "en": "Styx", "system": "希臘神話", "region": "希臘", "concept": "冥河／重誓", "influence": "環繞冥界的誓約之河,也是其女神。諸神所立最重之誓,須以她之名;違者,昏睡一年、再放逐九年。", "means": "她的河水令誓言「不可違背」——連宙斯亦受其縛;她也賜其子阿基里斯刀槍不入(唯餘一踵)。", "brief": "環繞冥界的誓約之河;眾神立重誓所憑", "source": "Theoi Styx", "tier": "A", "tier_label": "A · 誓約之河", "num": 7, "band": "sovereign", "radar": [70, 60, 44, 20, 42, 90], "flagship": true, "voice": null, "desc": "連神都不敢欺騙的,是她。眾神立最重之誓,必以斯堤克斯之名——伊里斯會取一瓶她的河水為證。違誓的神,要昏睡整整一年,再被逐出神宴九年。她也是把幼子阿基里斯浸入河中、使其全身不破的母親——唯獨那隻被她捏住的腳踵,成了日後致命的弱點。記之:最強的約束,不是力量,是一句「連神都不敢反悔」的誓。"}, {"rank": 257, "cn": "彌諾陶洛斯", "en": "Minotaur", "system": "希臘神話", "region": "希臘", "concept": "迷宮／牛首怪", "influence": "牛首人身的怪物,囚於克里特迷宮深處。雅典須年年進貢童男童女,供其吞噬,直至忒修斯將其斬殺。", "means": "困於迷宮,既是囚徒也是刑具;它不出迷宮,但凡入迷宮者,九成九有去無回。", "brief": "囚於克里特迷宮的牛首人身怪物", "source": "Britannica Minotaur", "tier": "B", "tier_label": "B · 迷宮噬人", "num": 4, "band": "edge", "radar": [56, 38, 18, 8, 64, 60], "flagship": true, "voice": null, "desc": "牛頭人身,生於王后與一頭神牛的孽緣,被羞愧的國王囚入岱達羅斯所造的迷宮。雅典戰敗後,每九年要送七對童男童女入迷宮餵牠。直到忒修斯帶著阿里阿德涅的一團紅線走入黑暗——殺了牠,再循線走出。記之:最可怕嘅怪物,往往係被自己人關喺暗處、唔願提起嗰隻;而打敗牠嘅,從來唔係蠻力,係一條唔放手嘅線。"}, {"rank": 258, "cn": "喀耳刻", "en": "Circe", "system": "希臘神話", "region": "希臘", "concept": "魔女／變形", "influence": "太陽神之女,精通藥草與咒術的魔女。她以魔藥將闖入其島的人變成豬、狼、獅,留作己用。", "means": "一杯摻藥之酒、一揮魔杖,人即失其人形而存其心智——最殘忍之處,在於變成畜牲後仍記得自己是誰。", "brief": "埃尤島上的魔女,化人為獸", "source": "Britannica Circe", "tier": "B", "tier_label": "B · 魔女／變形", "num": 4, "band": "edge", "radar": [58, 44, 32, 28, 60, 54], "flagship": true, "voice": null, "desc": "住喺埃尤島嘅魔女,赫利俄斯之女。奧德修斯嘅船員上岸,被佢一杯藥酒變成一群豬——身係豬,心仲係人,記得自己係邊個,先最痛苦。奧德修斯靠神草護身,逼佢解咒,反留咗成年。記之:佢嘅魔法揭示一件事——人同獸之間嗰條線,比你想像中薄;而最深嘅詛咒,係令你變咗,但仲記得自己本來係咩。"}, {"rank": 259, "cn": "珀伽索斯", "en": "Pegasus", "system": "希臘神話", "region": "希臘", "concept": "神駿／飛馬", "influence": "自美杜莎頸血中誕生的飛馬,潔白而通靈。它助英雄貝勒羅豐斬殺怪物喀邁拉,後升上天成為星座。", "means": "雙翼凌空,蹄落之處湧出靈泉(詩泉);唯純淨者可馴,驕傲者一旦想騎牠上奧林帕斯,必被摔落。", "brief": "美杜莎頸血所生的潔白飛馬", "source": "Theoi Pegasus", "tier": "B", "tier_label": "B · 神駿飛馬", "num": 5, "band": "edge", "radar": [50, 46, 70, 30, 66, 44], "flagship": true, "voice": null, "desc": "由美杜莎被斬後嘅頸血裏誕生——最美嘅嘢,有時生自最恐怖嘅死。佢係潔白嘅飛馬,助英雄貝勒羅豐飛天斬殺噴火怪喀邁拉。但當貝勒羅豐得意忘形、想騎佢直闖神界,佢一甩,將人摔返落地。記之:佢肯載你飛幾高,睇你個心有幾乾淨;一驕傲,佢就唔要你。最後佢升天成座,蹄踏之處,湧出詩人嘅靈泉。"}, {"rank": 260, "cn": "喀戎", "en": "Chiron", "system": "希臘神話", "region": "希臘", "concept": "賢者／醫者師", "influence": "馬人(半人馬)中最智慧、最高貴的一位,眾英雄之師。醫術、音樂、占星、武藝——皆由他傳授。", "means": "不以蠻力,而以「教」立身;他育成阿基里斯、伊阿宋、阿斯克勒庇俄斯等無數英雄,是文明在野性中的火種。", "brief": "半人馬中最智慧高貴者,眾英雄之師", "source": "Britannica Chiron", "tier": "B", "tier_label": "B · 賢者馬人", "num": 5, "band": "edge", "radar": [54, 48, 80, 44, 58, 54], "flagship": true, "voice": null, "desc": "半人馬大多粗野好鬥,佢係唯一嘅例外——最智慧、最溫和嗰個。醫神、英雄阿基里斯、尋找金羊毛嘅伊阿宋,全都係佢徒弟。佢身為不死之身,卻誤中毒箭、痛不欲生,最後自願放棄永生,換取解脫,被宙斯升上天成為人馬座。記之:最高貴嘅力量,係用嚟「教導」而唔係「征服」;而佢最後嘅選擇話我哋知——有時,連神都會選擇放下。"}, {"rank": 261, "cn": "卡里忒斯（美惠三女神）", "en": "Charites (Graces)", "system": "希臘神話", "region": "希臘", "concept": "優雅／喜悅／豐美", "influence": "優雅、美麗與歡愉的三位女神(光輝、繁茂、歡欣)。她們為生命添上「不必要、卻使之值得」的那層光彩。", "means": "不掌權、不裁判,只「點綴」——筵席的歡樂、藝術的優美、人際的善意,皆因她們而生動。", "brief": "優雅、美麗與歡欣的三位女神", "source": "Theoi Charites", "tier": "C", "tier_label": "C · 優雅／喜悅", "num": 4, "band": "sovereign", "radar": [52, 50, 80, 46, 54, 30], "flagship": true, "voice": null, "desc": "三位姊妹——光輝、繁茂、歡欣。她們不管權力、不司刑罰,她們掌的是「優雅」本身:筵席上的笑、舞步裏的美、人與人之間那點不求回報的善意。常隨愛神與繆斯左右,為一切美好之事鍍上最後一層光。記之:生命裏有許多「冇咗都死唔去、但有咗先值得」嘅嘢——音樂、笑聲、一個溫柔嘅手勢——嗰啲,就係佢哋。"}];

  {key:"sovereign",seal:"權",cn:"主權諸神",en:"Sovereigns",cls:"seal-sov",color:"--c-sov",tier:"S · A · C",
   essence:"立法者與裁決者,以及替宇宙司職的眾神——由執雷的王,到掌管正義、記憶、勝利與健康的小神。向他們求,不是求恩,是求一次各司其職的回應。"},
  {key:"edge",seal:"力",cn:"邊界之力",en:"Force at the edge",cls:"seal-edge",color:"--c-edge",tier:"B",
   essence:"秩序與混沌的角力。每一隻怪都有剋星,每一個英雄都有死穴。"},
  {key:"folk",seal:"信",cn:"人間之神",en:"Gods among us",cls:"seal-folk",color:"--c-folk",tier:"C",
   essence:"靠眾人香火維生的神。有廟、有誕期、有求必應——陌生人的虔誠養住祂。",warm:"rgba(242,189,92,.10)"},
  {key:"kin",seal:"念",cn:"念故者",en:"Those we keep",cls:"seal-kin",color:"--c-kin",tier:"C · F · H",
   essence:"被記得的死者。冇廟、冇誕、冇香客,只有屋企人。本體之力近乎零,親密卻是全圖最高——因為能越過門檻的,從來唔係權力,係思念。一旦無人惦記,就會慢慢墮向下一環。",warm:"rgba(213,140,110,.11)"},
  {key:"threshold",seal:"懼",cn:"門檻之靈",en:"At the threshold",cls:"seal-thr",color:"--c-thr",tier:"D – F",
   essence:"睡眠、死亡、路口與夜。陌生而帶惡意的亡者與妖——大多只是恐懼在邊界上長出的形狀。"},
  {key:"matter",seal:"物",cn:"退潮:靈散為物",en:"The tide goes out",cls:"seal-mat",color:"--c-mat",tier:"F · 科學",
   essence:"潮水退去。「靈」被還原成一件被誤讀的物理事件。圖鑑到這裡,光熄了。"}
];
const VOICE_NAME={law:"冷峻文言",epic:"莊嚴史詩",hero:"英雄敘事",folk:"溫暖港式口語",kin:"家祠口吻",threshold:"都市怪談",matter:"乾燥科普",coda:"終章 · 夢的低語"};
const VOICE_OF={law:"law",sovereign:"epic",edge:"hero",folk:"folk",kin:"kin",threshold:"threshold",matter:"matter"};
const HINTS={
  band:"每枚印記,就係那隻靈體的雷達側影——形狀即身份。撳落去看完整法陣;撥動上面的「光照」,用任何一條軸重新點亮整片圖鑑。",
  power:"鏡頭:本體權能。越往上越亮——這正是傳統段位榜的排法,看起來理所當然。",
  scope:"鏡頭:影響半徑。法則管整個宇宙,屋企神只管你那條街——光從頂層鋪到中段,再向下收細。",
  valence:"鏡頭:向人性。兩條暖帶一齊亮起——「信」的諸神與「念」的故人;發暗的是吞噬、拖拽、奪命的那些。",
  nego:"鏡頭:可協商度。能用香火和許願打動的,集中在「人間之神」;<b>對「必然」祈禱,沒有用。</b>",
  vivid:"鏡頭:信仰熱度。看「信」環燒起,而「念」環依然安靜——<b>最被愛的故人,從來唔係最有名的神。</b>熱度不等於親密,這正是落差所在。",
  liminal:"鏡頭:臨界性。發亮的都站在門檻上——生與死、夢與醒、岸與海之間;「念」與「懼」兩環,正是門檻的兩面。"
};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const cvar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const state={lens:"band",region:"all",q:""};

function ramp(v){
  const stops=[[0,[56,68,92]],[50,[150,118,94]],[100,[244,201,93]]];
  v=Math.max(0,Math.min(100,v));
  let a=stops[0],b=stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++){ if(v>=stops[i][0]&&v<=stops[i+1][0]){a=stops[i];b=stops[i+1];break;} }
  const t=(v-a[0])/((b[0]-a[0])||1);
  const c=a[1].map((x,i)=>Math.round(x+(b[1][i]-x)*t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function entColor(e){
  if(state.lens==="band"){ return cvar(BANDS.find(b=>b.key===e.band).color); }
  return ramp(e.radar[AXES.findIndex(a=>a.k===state.lens)]);
}
const regionMatch=e=>state.region==="all"||e.region===state.region;
const searchMatch=e=>!state.q||e.cn.toLowerCase().includes(state.q.toLowerCase())||(e.en||"").toLowerCase().includes(state.q.toLowerCase());

function glyphSVG(vals){
  const cx=32,cy=32,R=22,n=6;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  const frame=Array.from({length:n},(_,i)=>pt(i,R).map(v=>v.toFixed(1)).join(",")).join(" ");
  const sig=vals.map((v,i)=>pt(i,R*Math.max(v,4)/100).map(x=>x.toFixed(1)).join(",")).join(" ");
  return `<polygon class="gframe" points="${frame}"/><polygon class="gsig" points="${sig}"/>`;
}

function build(){
  const main=$("#spectrum");
  BANDS.forEach((band,bi)=>{
    const list=ENTITIES.filter(e=>e.band===band.key).sort((a,b)=>b.radar[0]-a.radar[0]);
    const sec=document.createElement("section");
    sec.className="band"+(band.warm?" band-warm":"");
    if(band.warm)sec.style.setProperty("--warm-wash",band.warm);
    sec.style.transitionDelay=(bi*65)+"ms";
    sec.innerHTML=
      `<div class="seal-bg ${band.cls}">${band.seal}</div>`+
      `<div class="band-head"><span class="band-seal ${band.cls}">${band.seal}</span>`+
      `<span class="band-name">${band.cn}</span><span class="band-en">${band.en}</span>`+
      `<span class="band-tier">${band.tier}</span><span class="band-count">${list.length} 位</span></div>`+
      `<p class="band-essence">${band.essence}</p><div class="plate"></div>`;
    const plate=sec.querySelector(".plate");
    list.forEach(e=>{
      const sz=Math.round(30+(e.radar[0]/100)*24);
      const cell=document.createElement("button");
      cell.className="cell"+(e.flagship?" flag":"");
      cell.dataset.rank=e.rank;
      cell.setAttribute("aria-label",e.cn+(e.en?" "+e.en:""));
      cell.innerHTML=`<svg class="glyph" width="${sz}" height="${sz}" viewBox="0 0 64 64" aria-hidden="true">${glyphSVG(e.radar)}</svg>`+
        `<span class="cap">${e.cn}${e.en?`<span class="en">${e.en}</span>`:""}</span>`;
      cell.addEventListener("click",()=>openDetail(e.rank));
      plate.appendChild(cell);
    });
    main.appendChild(sec);
  });
  paint();
  $("#legend").innerHTML=BANDS.map(b=>`<span><i style="background:${cvar(b.color)}"></i>${b.seal} ${b.cn} · ${b.en}</span>`).join("");
  $("#colophon").innerHTML=`共 <b>${ENTITIES.length}</b> 位靈體,分作七環;其中 <b>${ENTITIES.filter(e=>e.flagship).length}</b> 位已立傳——以該環應有的語域精寫,並附豐富化的影響/職權與能力/手段,名字亮色顯示。每一位點開,都有<b>六軸逐條解讀</b>(數值＋一句詮釋＋量條);任何一位都可按 <b>「深掘立傳」</b>,即場以對應語域 AI 續寫詳盡傳記、深化資料——亦即逐一整牌之途。每枚印記:形狀＝六軸側影,大小＝本體權能,顏色隨「光照」而變。`;
  requestAnimationFrame(()=>$$(".band").forEach(s=>s.classList.add("in")));
}
function paint(){
  $$(".cell").forEach(c=>{
    const e=ENTITIES.find(x=>x.rank==c.dataset.rank);
    c.style.color=entColor(e);
    c.classList.toggle("dim",!(regionMatch(e)&&searchMatch(e)));
  });
}
function setLens(l){ state.lens=l; $$(".lens").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lens===l));
  $("#hint").innerHTML=HINTS[l]; $("#hint").style.opacity=0; requestAnimationFrame(()=>$("#hint").style.opacity=1); paint(); }
function setRegion(r){ state.region=r; $$(".reg").forEach(b=>b.setAttribute("aria-pressed",b.dataset.reg===r)); paint(); }

function radarSVG(vals,color){
  const cx=140,cy=140,R=100,n=6;
  const pt=(i,r)=>{const ang=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(ang),cy+r*Math.sin(ang)];};
  let s=`<svg class="radar draw" viewBox="0 0 280 280" role="img" aria-label="六軸法陣">`;
  [25,50,75,100].forEach(p=>{
    const poly=Array.from({length:n},(_,i)=>pt(i,R*p/100).map(v=>v.toFixed(1)).join(",")).join(" ");
    s+=`<polygon class="ring" points="${poly}"/>`;});
  for(let i=0;i<n;i++){const[x,y]=pt(i,R);s+=`<line class="spoke" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;}
  const vpoly=vals.map((v,i)=>pt(i,R*v/100).map(x=>x.toFixed(1)).join(",")).join(" ");
  s+=`<polygon class="poly" points="${vpoly}" fill="${color}" fill-opacity="0.2" stroke="${color}" stroke-width="1.4"/>`;
  vals.forEach((v,i)=>{const[x,y]=pt(i,R*v/100);s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="${color}"/>`;});
  for(let i=0;i<n;i++){const[x,y]=pt(i,R+18);const c=Math.cos(-Math.PI/2+i*2*Math.PI/n);
    const anc=c>0.3?"start":c<-0.3?"end":"middle";const dy=y<cy?-2:y>cy?12:4;
    s+=`<text x="${x.toFixed(1)}" y="${(y+dy).toFixed(1)}" text-anchor="${anc}">${AXES[i].label}</text>`;}
  s+=`</svg>`;return s;
}
function openDetail(rank){
  const e=ENTITIES.find(x=>x.rank==rank); if(!e)return;
  const band=BANDS.find(b=>b.key===e.band); const col=cvar(band.color);
  const voice=e.voice||VOICE_OF[e.band];
  const tierStyle=`background:${col}22;color:${col};border:1px solid ${col}55`;
  const meta=[["環",band.cn],["系統",e.system],["概念",e.concept],["段位",e.tier_label]]
    .filter(m=>m[1]).map(m=>`<span>${m[0]} <b>${m[1]}</b></span>`).join("");
  const axisRows=AXES.map((a,i)=>{const v=e.radar[i];return `<div class="axrow"><span class="axname">${a.label}</span><span class="axbar"><span class="axfill" style="width:${v}%;background:${col}"></span></span><span class="axval">${v}</span><span class="axread">${axisRead(i,v)}</span></div>`;}).join("");
  const untold=e.flagship?"":`<span class="untold">待立傳</span>`;
  const facts=[["對人的影響／職權",e.influence],["能力與手段",e.means]]
    .filter(f=>f[1]&&f[1]!=="—").map(f=>`<div><b>${f[0]}</b><br>${f[1]}</div>`).join("");
  $("#dr-body").innerHTML=
    `<button class="dr-close" aria-label="關閉"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>`+
    `<span class="dr-tier" style="${tierStyle}">${e.tier_label||e.tier}</span>`+
    `<h2 class="dr-cn">${e.cn}</h2>`+(e.en?`<p class="dr-en">${e.en}</p>`:"")+
    `<div class="dr-meta">${meta}</div>`+
    `<div class="radar-wrap">${radarSVG(e.radar,col)}</div>`+
    `<div class="axis-block">${axisRows}</div>`+
    `<div class="voice-tag"><span>語域 · ${VOICE_NAME[voice]||""}</span>${untold}</div>`+
    `<div class="desc v-${voice}">${e.desc||e.brief||""}</div>`+
    (facts?`<div class="facts">${facts}</div>`:"")+
    (e.source&&e.source!=="—"?`<p class="source">來源 · ${e.source}</p>`:"")+
    `<div class="deepen-wrap"><button class="deepen" id="deepen-btn">✦ 為此靈深掘立傳（AI 續寫）</button><div id="deepen-out"></div></div>`;
  $("#dr-body").querySelector(".dr-close").addEventListener("click",closeDetail);
  const db=$("#deepen-btn"); if(db) db.addEventListener("click",()=>deepen(e,db));
  const dr=$("#drawer"); dr.classList.add("open"); dr.setAttribute("aria-hidden","false");
  $("#scrim").classList.add("open"); dr.scrollTop=0; dr.focus();
  const r=dr.querySelector(".radar"); if(r)requestAnimationFrame(()=>r.classList.remove("draw"));
}
function closeDetail(){ $("#drawer").classList.remove("open"); $("#drawer").setAttribute("aria-hidden","true"); $("#scrim").classList.remove("open"); }

async function deepen(e,btn){
  const band=BANDS.find(b=>b.key===e.band); const voice=e.voice||VOICE_OF[e.band];
  btn.disabled=true; btn.textContent="深掘中⋯⋯";
  const prompt=`你係一位博學而文筆優美嘅靈異圖鑑作者。本圖鑑核心主題:權力與親密成反比——最有權能者最冷漠、不可祈求;最被惦記者(如祖先、夢中故人)權能近乎零,卻最親。

請為以下靈體撰寫一段「立傳」,並深化佢嘅資料。

名稱:${e.cn}${e.en?` (${e.en})`:""}
所屬環:${band.cn} / ${band.en}（${band.essence}）
系統:${e.system||"—"}
概念:${e.concept||"—"}
現有影響/職權:${e.influence||"—"}
現有能力/手段:${e.means||"—"}
現有簡介:${e.brief||"—"}
六軸數值(0-100):本體權能${e.radar[0]}、影響半徑${e.radar[1]}、向人性${e.radar[2]}、可協商度${e.radar[3]}、信仰熱度${e.radar[4]}、臨界性${e.radar[5]}

語域要求:${REGISTER[voice]||REGISTER.epic}

請只輸出一個 JSON 物件,唔好有任何其他文字或 markdown 圍欄。格式:
{"desc":"一段約 130–200 字、極之詳盡而緊扣上述語域嘅立傳","influence":"深化後嘅對人的影響／職權,約 35–60 字","means":"深化後嘅能力與手段,約 35–60 字","axes":"六軸解讀,逐軸用一句解釋點解係咁個數值,合共約 70–110 字"}`;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}]})});
    const data=await res.json();
    let txt=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
    txt=txt.replace(/```json/gi,"").replace(/```/g,"").trim();
    const s=txt.indexOf("{"), en=txt.lastIndexOf("}");
    if(s>=0&&en>s) txt=txt.slice(s,en+1);
    const o=JSON.parse(txt);
    const out=$("#deepen-out");
    out.innerHTML=`<div class="deep-card"><div class="deep-tag">✦ AI 深掘 · ${VOICE_NAME[voice]||""}</div>`+
      (o.desc?`<div class="desc v-${voice}">${o.desc}</div>`:"")+
      ((o.influence||o.means)?`<div class="facts">`+(o.influence?`<div><b>影響／職權（深掘）</b><br>${o.influence}</div>`:"")+(o.means?`<div><b>能力／手段（深掘）</b><br>${o.means}</div>`:"")+`</div>`:"")+
      (o.axes?`<div class="deep-axes"><b>六軸解讀</b>　${o.axes}</div>`:"")+`</div>`;
    btn.style.display="none";
  }catch(err){
    btn.disabled=false; btn.textContent="✦ 再試一次";
    $("#deepen-out").innerHTML=`<div class="deep-err">深掘暫時唔得（可能係網絡未連上,或此環境未開放 AI 續寫）。原有資料仍然喺度。</div>`;
  }
}

document.addEventListener("DOMContentLoaded",()=>{
  build();
  $("#q").addEventListener("input",ev=>{state.q=ev.target.value.trim();paint();});
  $$(".lens").forEach(b=>b.addEventListener("click",()=>setLens(b.dataset.lens)));
  $$(".reg").forEach(b=>b.addEventListener("click",()=>setRegion(b.dataset.reg)));
  $("#scrim").addEventListener("click",closeDetail);
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail();});
  $("#hint").innerHTML=HINTS.band;
});
</script>
</body>
</html>
